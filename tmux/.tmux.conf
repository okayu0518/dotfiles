# ── 基本設定 ──────────────────────────
set -g default-terminal "xterm-256color"
# set -ag terminal-overrides ",xterm-256color:RGB"  # True color必要なら有効化

set -g mouse on

set -g set-titles on
set -g set-titles-string "#T"

# Windows Terminalで制御コードが漏れるのを防ぐ
set -s escape-time 100

set -s copy-command "xsel --clipboard --input"
# set -s set-clipboard off  # copy-pipeと競合する場合はこちらを有効化

# ── プレフィックスキー ──────────────────
unbind C-b
set -g prefix C-t
bind C-t send-prefix

# ── コピーモード ──────────────────────
setw -g mode-keys vi

# ── ステータスバー ─────────────────────
set -g status-bg blue
set -g status-fg black

# プレフィックス押下中は左側に表示
set -g status-left '#{?client_prefix,#[bg=colour129] PREFIX #[default],}'
set -g status-left-length 20

# アクティブウィンドウの表示
setw -g window-status-current-format '#[bg=colour2,fg=colour255] #I #W '
